<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заявка — МебельДива</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <header>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark" aria-label="Основная навигация">
      <div class="container">
        <a class="navbar-brand" href="index.html">МебельДива</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavigation">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
            <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
            <li class="nav-item"><a class="nav-link" href="product.html">Товар</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="order.html">Заявка</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">
            <h1 class="h4 mb-0">Форма заявки</h1>
          </div>
          <div class="card-body">
            <div class="alert alert-info" role="alert">
              Заполните форму. Поля со звёздочкой обязательны.
            </div>
            <form>
              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label for="order-name" class="form-label">Имя *</label>
                  <input id="order-name" type="text" class="form-control" required>
                </div>
                <div class="col-12 col-md-6">
                  <label for="order-email" class="form-label">E-mail *</label>
                  <input id="order-email" type="email" class="form-control" required>
                </div>
                <div class="col-12 col-md-6">
                  <label for="order-phone" class="form-label">Телефон</label>
                  <div class="input-group">
                    <span class="input-group-text">+7</span>
                    <input id="order-phone" type="tel" class="form-control" placeholder="900 000-00-00">
                  </div>
                </div>
                <div class="col-12 col-md-6">
                  <label for="order-product" class="form-label">Товар</label>
                  <select id="order-product" class="form-select">
                    <option selected>Выберите товар</option>
                    <option value="1">Диван «Босые ноги»</option>
                    <option value="2">Кресло «Лыжник»</option>
                    <option value="3">Диван «Хищник»</option>
                  </select>
                </div>
                <div class="col-12">
                  <label for="order-comment" class="form-label">Комментарий</label>
                  <textarea id="order-comment" class="form-control" rows="4"></textarea>
                </div>
                <div class="col-12">
                  <div class="form-check">
                    <input id="order-agree" class="form-check-input" type="checkbox" required>
                    <label class="form-check-label" for="order-agree">Я согласен на обработку данных *</label>
                  </div>
                </div>
                <div class="col-12 d-flex gap-2">
                  <button class="btn btn-primary" type="submit">Отправить заявку</button>
                  <button class="btn btn-outline-secondary" type="reset">Очистить</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-0">&copy; 2026 Мастерская «МебельДива».</p>
    </div>
  </footer>

  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
